apiVersion: v1
kind: Service
metadata:
  name: order-web
  labels:
    app: order-web
spec:
  type: NodePort
  selector:
    app: order-web
  ports:
    - name: http
      port: 80          # ClusterIP port (inside the cluster)
      targetPort: http  # container port 80 (nginx)
      nodePort: 30081   # 30080 is taken by salary-app
