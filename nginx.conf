server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # same-origin API: forwarded unchanged to the backend, so the bundle holds
    # no backend URL and the browser never makes a cross-origin (CORS) request.
    # ${API_UPSTREAM} is filled in from the environment at container start.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # file names under assets/ contain a content hash, so they never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # the MSW service worker must never be served stale
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths get index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
